name: Publish Planzo from Figma Make

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Dry run checks access and code; publish performs the full sync"
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - publish
  schedule:
    # 10:00 AM Asia/Kolkata. Date gate below limits this to 2026.
    - cron: "30 4 21-31 10 *"
    - cron: "30 4 1-19 11 *"

permissions:
  contents: write

concurrency:
  group: planzo-cloud-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      PLANZO_RUN_DIR: ${{ runner.temp }}/planzo-sync
    steps:
      - name: Check 30-day window
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE_INPUT: ${{ inputs.mode }}
        run: |
          today="$(TZ=Asia/Kolkata date +%F)"
          if [ "$EVENT_NAME" = "schedule" ]; then
            if [ "$today" \< "2026-10-21" ] || [ "$today" \> "2026-11-19" ]; then
              echo "active=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "mode=publish" >> "$GITHUB_OUTPUT"
          else
            echo "mode=${MODE_INPUT:-dry-run}" >> "$GITHUB_OUTPUT"
          fi
          echo "active=true" >> "$GITHUB_OUTPUT"

      - name: Check out main without stored credentials
        if: steps.gate.outputs.active == 'true'
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Python
        if: steps.gate.outputs.active == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser and README review dependencies
        if: steps.gate.outputs.active == 'true'
        run: |
          python -m pip install --disable-pip-version-check playwright openai pydantic
          python -m playwright install --with-deps chromium

      - name: Export Make source and compare it with the last published source
        if: steps.gate.outputs.active == 'true'
        id: export
        env:
          FIGMA_STORAGE_STATE_B64: ${{ secrets.FIGMA_STORAGE_STATE_B64 }}
        run: python scripts/planzo_cloud_sync.py download

      - name: Set up Node.js
        if: steps.export.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify changed Make code
        if: steps.export.outputs.changed == 'true'
        run: |
          npm install -g pnpm@10
          cd "$PLANZO_RUN_DIR/make-source"
          pnpm install --frozen-lockfile
          pnpm run typecheck
          pnpm test
          pnpm run build

      - name: Review whether README needs a flow update
        if: steps.export.outputs.changed == 'true' && steps.gate.outputs.mode == 'publish'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/planzo_cloud_sync.py review-readme

      - name: Publish the changed Make app to its existing Figma Site
        if: steps.export.outputs.changed == 'true' && steps.gate.outputs.mode == 'publish'
        env:
          FIGMA_STORAGE_STATE_B64: ${{ secrets.FIGMA_STORAGE_STATE_B64 }}
        run: python scripts/planzo_cloud_sync.py publish

      - name: Push Make source and any necessary README update to main
        if: steps.export.outputs.changed == 'true' && steps.gate.outputs.mode == 'publish'
        env:
          GH_PUSH_TOKEN: ${{ github.token }}
        run: python scripts/planzo_cloud_sync.py sync
